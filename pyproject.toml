[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-local"
version = "0.1.0"
description = "Local document knowledge workspace"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "platformdirs>=4,<5", "pywebview>=6,<7", "python-docx>=1,<2", "pypdf>=6,<7"]

[project.scripts]
sb = "second_brain.cli:main"

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
second_brain = ["desktop/*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
